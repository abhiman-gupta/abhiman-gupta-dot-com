name: Check live site

# Visits the live site after every deploy and once a month. If anything below is wrong the run fails,
# and GitHub emails the repo owner. The log says exactly which check failed.
on:
  workflow_run:
    workflows: ["Deploy website to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "0 15 1 * *" # 1st of each month, 08:00 Tucson time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # "Deployed" isn't "live": GitHub Pages can keep serving the old site for a while. Wait until the live site says
      # it is the commit that was just deployed (pages.yml writes it to /version.txt), and fail if it never does.
      - name: Live site is the commit just deployed
        if: github.event_name == 'workflow_run'
        env:
          WANT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 30); do
            live=$(curl -s -H 'Cache-Control: no-cache' "https://abhimangupta.com/version.txt?t=$(date +%s)" | tr -d '[:space:]')
            if [ "$live" = "$WANT" ]; then echo "Live site is $WANT"; exit 0; fi
            echo "Live site is ${live:-unknown}, waiting for $WANT ($i/30)"
            sleep 10
          done
          echo "::error::After 5 minutes the live site still isn't commit $WANT (it says ${live:-nothing}). The deploy didn't take."
          exit 1
      - name: Key pages and files are online
        run: |
          fail=0
          for path in / /professional/ /photography/ /recommended/ /og.jpg /sitemap.xml /robots.txt /.well-known/security.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "https://abhimangupta.com$path")
            if [ "$code" = "200" ]; then echo "OK      $path"; else echo "::error::$path returned HTTP $code"; fail=1; fi
          done
          exit $fail
      - name: security.txt is not about to expire
        run: |
          expires=$(curl -s https://abhimangupta.com/.well-known/security.txt | sed -n 's/^Expires: *//p' | tr -d '\r')
          days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
          echo "security.txt expires $expires ($days days from now)"
          if [ "$days" -lt 30 ]; then
            echo "::error::security.txt expires in $days days. Update the Expires date in public/.well-known/security.txt."
            exit 1
          fi
